baseURL      = "https://carmelolg.github.io/shiori/"
title        = "MyLib Docs"
theme        = "shiori"
locale       = "en"
paginate     = 20

[params]
  description  = "Official documentation for MyLib — a fast, type-safe utility library for modern applications."
  author       = "carmelolg"
  version      = "2.3.1"
  currentVersion = "v2.3.1"
  tagline      = "A fast, type-safe, zero-dependency utility library for modern applications"
  licenseName  = "MIT"
  license      = "https://github.com/carmelolg/mylib/blob/main/LICENSE"
  website      = "https://carmelolg.github.io"
  github       = "https://github.com/carmelolg/mylib"
  editBaseURL  = "https://github.com/carmelolg/mylib/edit/main/docs/content"
  logoText     = "MyLib"
  install      = "npm install mylib"
  quickStartURL = "/v2.3.1/articles/getting-started/"
  heroTitle    = "MyLib <span>Documentation</span>"
  dateFormat   = "January 2, 2006"
  
  # Multi-version support
  [[params.versions]]
    label = "v2.3.1"
    url   = "/v2.3.1/"
  [[params.versions]]
    label = "v1.0.0"
    url   = "/v1.0.0/"

[markup]
  [markup.highlight]
    noClasses          = false
    lineNos            = false
    codeFences         = true
    guessSyntax        = true
    tabWidth           = 2
  [markup.goldmark.renderer]
    unsafe = true

[outputs]
  home    = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]
  page    = ["HTML"]

[taxonomies]
  tag = "tags"

[menu]
  [[menu.main]]
    name   = "API Reference"
    url    = "/api/"
    weight = 1
  [[menu.main]]
    name   = "Articles"
    url    = "/articles/"
    weight = 2
  [[menu.main]]
    name   = "Design"
    url    = "/design/"
    weight = 3
