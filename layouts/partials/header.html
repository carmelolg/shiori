<header class="site-header" role="banner">
  <!-- Mobile hamburger -->
  <button id="hamburger" class="icon-btn" aria-label="Toggle sidebar" aria-expanded="false" aria-controls="site-sidebar">
    <svg viewBox="0 0 16 16"><path d="M1 2.75A.75.75 0 0 1 1.75 2h12.5a.75.75 0 0 1 0 1.5H1.75A.75.75 0 0 1 1 2.75Zm0 5A.75.75 0 0 1 1.75 7h12.5a.75.75 0 0 1 0 1.5H1.75A.75.75 0 0 1 1 7.75ZM1.75 12h12.5a.75.75 0 0 1 0 1.5H1.75a.75.75 0 0 1 0-1.5Z"/></svg>
  </button>

  <!-- Logo -->
  <a class="header-logo" href="{{ "/" | relURL }}" aria-label="{{ .Site.Title }} home">
    {{ with .Site.Params.logo }}
      <img src="{{ . | relURL }}" alt="{{ $.Site.Title }} logo">
    {{ end }}
    <span class="header-logo-text">{{ .Site.Params.logoText | default .Site.Title }}</span>
  </a>
  <div class="header-search-wrap">
    <div class="search-box">
      <svg class="search-icon" viewBox="0 0 16 16"><path d="M10.68 11.74a6 6 0 0 1-7.922-8.982 6 6 0 0 1 8.982 7.922l3.04 3.04a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215ZM11.5 7a4.499 4.499 0 1 0-8.997 0A4.499 4.499 0 0 0 11.5 7Z"/></svg>
      <input
        id="header-search-input"
        class="search-input"
        type="search"
        placeholder="{{ i18n "search_placeholder" | default "Search docs…" }}"
        autocomplete="off"
        spellcheck="false"
        aria-label="Search documentation"
      >
      <div id="header-search-results" class="search-results" role="listbox" aria-label="Search results"></div>
    </div>
  </div>

  <!-- Actions -->
  <div class="header-actions">
    {{ with .Site.Params.github }}
    <a href="{{ . }}" class="icon-btn" target="_blank" rel="noopener" aria-label="GitHub repository">
      <svg viewBox="0 0 16 16"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg>
    </a>
    {{ end }}

    <!-- Dark mode toggle -->
    <button id="theme-toggle" class="icon-btn" aria-label="Toggle dark mode">
      <!-- Sun (shown in dark mode) -->
      <svg class="icon-sun" viewBox="0 0 24 24" style="display:none">
        <circle cx="12" cy="12" r="4" fill="currentColor"/>
        <line x1="12" y1="2"  x2="12" y2="5"  stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <line x1="12" y1="19" x2="12" y2="22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <line x1="2"  y1="12" x2="5"  y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <line x1="19" y1="12" x2="22" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <line x1="4.22"  y1="4.22"  x2="6.34"  y2="6.34"  stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <line x1="17.66" y1="17.66" x2="19.78" y2="19.78" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <line x1="4.22"  y1="19.78" x2="6.34"  y2="17.66" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <line x1="17.66" y1="6.34"  x2="19.78" y2="4.22"  stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <!-- Moon (shown in light mode) -->
      <svg class="icon-moon" viewBox="0 0 24 24">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="currentColor"/>
      </svg>
    </button>
  </div>
</header>
