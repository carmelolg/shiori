<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang | default "en" }}" data-theme="light">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  {{ partial "header.html" . }}

  <div class="layout{{ if and .Params.toc .TableOfContents }} has-toc{{ end }}">
    <aside class="site-sidebar" id="site-sidebar" aria-label="Sidebar navigation">
      {{ partial "sidebar.html" . }}
    </aside>

    <main class="main-content" id="main-content">
      {{ block "main" . }}{{ end }}
    </main>

    {{ if and .Params.toc .TableOfContents }}
    <aside class="toc-sidebar" aria-label="Table of contents">
      {{ partial "toc.html" . }}
    </aside>
    {{ end }}
  </div>

  {{ partial "footer.html" . }}
</body>
</html>
